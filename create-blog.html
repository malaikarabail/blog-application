<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog | Create Blog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   
    <header>
        <nav>
            <h2>My Blog</h2>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="create-blog.html">Create Blog</a>
            </div>
        </nav>
    </header>


    <!-- Create Blog Section -->
    <main class="create-blog-page">

        <div class="create-blog-card">

            <h1>Create New Blog</h1>

            <p class="create-subtitle">
                Share your ideas and stories with your readers.
            </p>


            <form id="blogForm">

                <!-- Blog Title -->
                <div class="form-group">

                    <label for="blogTitle">
                        Blog Title
                    </label>

                    <input
                        type="text"
                        id="blogTitle"
                        placeholder="Enter your blog title"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select a category
                        </option>

                        <option value="Technology">
                            Technology
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="Lifestyle">
                            Lifestyle
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                    </select>

                </div>


                <!-- Blog Content -->
                <div class="form-group">

                    <label for="blogContent">
                        Blog Content
                    </label>

                    <textarea
                        id="blogContent"
                        rows="10"
                        placeholder="Write your blog content here..."
                        required
                    ></textarea>

                </div>


                <!-- Buttons -->
                <div class="blog-buttons">

                    <button
                        type="button"
                        class="draft-btn"
                        id="draftBtn"
                    >
                        Save as Draft
                    </button>

                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Publish Blog
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 My Blog. All Rights Reserved.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
